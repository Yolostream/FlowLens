[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowlens"
version = "0.1.0"
description = "Static analyzer and documentation generator for Power Automate solutions"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Mateusz Yolostream"}]
keywords = ["power-automate", "power-platform", "static-analysis", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
flowlens = "flowlens.cli:main"

[project.urls]
Homepage = "https://github.com/Yolostream/flowlens"
Issues = "https://github.com/Yolostream/flowlens/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
